<!doctype html>
<html lang="fr" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Krino — pré-tri</title>
  </head>
  <body class="mobile">
    <!-- ═══ Accueil / autorisation ═══ -->
    <section id="vue-onboard" class="vue vue-onboard">
      <div class="onboard-contenu">
        <img src="/logo.png" alt="" class="onboard-logo" width="96" height="96" />
        <h1>Krino</h1>
        <p class="onboard-accroche" data-i18n="mobile.accroche"></p>
        <ul class="onboard-points">
          <li data-i18n="mobile.point1"></li>
          <li data-i18n="mobile.point2"></li>
        </ul>
        <button id="btn-autoriser" class="btn btn-primaire btn-large" data-i18n="mobile.autoriser"></button>
        <p id="onboard-etat" class="onboard-etat"></p>
      </div>
    </section>

    <!-- ═══ Liste des mois ═══ -->
    <section id="vue-mois" class="vue" hidden>
      <header class="barre barre-mobile">
        <span class="titre-dossier" data-i18n="mobile.titre"></span>
        <span class="espace"></span>
        <button id="btn-corbeille" class="btn btn-ico" aria-label="Corbeille">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        </button>
      </header>
      <div id="conteneur-mois" class="conteneur-mois"></div>
      <footer class="pied-demo">
        <span id="bandeau-demo"></span>
        <button id="btn-reinit-demo" class="btn btn-petit" data-i18n="mobile.reinitDemo"></button>
      </footer>
    </section>

    <!-- ═══ Tri (swipe) ═══ -->
    <section id="vue-tri" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-mois" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span id="titre-tri" class="titre-dossier"></span>
        <span class="espace"></span>
        <span id="progression-tri" class="progression"></span>
      </header>
      <div id="scene" class="scene">
        <div id="carte-fond" class="carte carte-fond" hidden>
          <div class="carte-visuel"></div>
        </div>
        <div id="carte" class="carte" hidden>
          <div class="carte-visuel">
            <!-- La photo est affichée entière (`contain`) ; ce fond flouté remplit
                 les bandes latérales plutôt que de laisser du noir mort. -->
            <img id="apercu-fond" class="apercu-fond" alt="" aria-hidden="true" />
            <img id="apercu-img" alt="" draggable="false" hidden />
            <video id="apercu-video" playsinline muted loop hidden></video>
            <div id="badge-garder" class="badge badge-garder" data-i18n="rafale.garder"></div>
            <div id="badge-jeter" class="badge badge-jeter" data-i18n="rafale.jeter"></div>
          </div>
          <div id="carte-infos" class="carte-infos"></div>
        </div>
        <div id="fin-mois" class="fin-mois" hidden>
          <h2 data-i18n="finMois.titre"></h2>
          <p data-i18n="finMois.texte"></p>
          <button id="btn-fin-revue" class="btn btn-primaire btn-large" data-i18n="tri.revue"></button>
        </div>
      </div>
      <footer id="pied-tri" class="pied-tri pied-tri-mobile">
        <button id="btn-jeter" class="btn-rond btn-rond-jeter" data-i18n-title="tri.jeter" aria-label="Jeter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="btn-annuler" class="btn-rond btn-rond-petit" data-i18n-title="tri.annulerTitre" aria-label="Annuler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h11a5 5 0 0 1 0 10h-3M3 10l5-5M3 10l5 5"/></svg>
        </button>
        <button id="btn-favori" class="btn-rond btn-rond-petit" data-i18n-title="tri.favoriTitre" aria-label="Favori">
          <svg class="ico-coeur" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button id="btn-garder" class="btn-rond btn-rond-garder" data-i18n-title="tri.garder" aria-label="Garder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </footer>
    </section>

    <!-- ═══ Revue de fin de mois ═══ -->
    <section id="vue-revue" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-tri" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span id="titre-revue" class="titre-dossier"></span>
      </header>
      <!-- Le bilan a sa propre ligne : inséré dans la barre, il la faisait passer
           sur deux lignes et tronquait le titre du mois. -->
      <p id="bilan-revue" class="sous-barre"></p>
      <div class="defilable">
        <p class="aide-revue" data-i18n="revue.aide"></p>
        <h3 class="titre-groupe garder" data-i18n="revue.gardees"></h3>
        <div id="grille-gardees" class="grille-vignettes"></div>
        <h3 class="titre-groupe jeter" data-i18n="revue.jetees"></h3>
        <div id="grille-jetees" class="grille-vignettes"></div>
      </div>
      <footer class="pied-action">
        <button id="btn-valider-mois" class="btn btn-primaire btn-large" data-i18n="revue.valider"></button>
      </footer>
    </section>

    <!-- ═══ Corbeille ═══ -->
    <section id="vue-corbeille" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-mois-2" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span class="titre-dossier" data-i18n="corbeille.titre"></span>
        <span class="espace"></span>
        <span id="bilan-corbeille" class="progression"></span>
      </header>
      <p class="aide-revue aide-corbeille"></p>
      <div id="grille-corbeille" class="grille-vignettes defilable"></div>
      <footer class="pied-action pied-action-double">
        <button id="btn-restaurer-tout" class="btn" data-i18n="corbeille.restaurerTout"></button>
        <button id="btn-vider" class="btn btn-danger" data-i18n="corbeille.vider"></button>
      </footer>
    </section>

    <!-- ═══ Chargement ═══ -->
    <div id="voile-chargement" class="voile-chargement" hidden>
      <div class="rond-chargement"></div>
      <span id="texte-chargement"></span>
    </div>

    <script type="module" src="/src/mobile/main.ts"></script>
  </body>
</html>
