[package]
name = "krino"
version = "0.10.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "krino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
walkdir = "2.5.0"
kamadak-exif = "0.6.1"
base64 = "0.22.1"
filetime = "0.2.29"
rayon = "1.12.0"
tauri-plugin-process = "2"
sha2 = "0.10"
# Accès à la photothèque Android (MediaStore) — voir docs/MOBILE.md.
tauri-plugin-krino-media = { path = "plugins/krino-media" }

# L'updater maison ne sert que sur le bureau : le Play Store gère les mises à
# jour Android, et ce plugin ne cible pas mobile.
#
# ATTENTION : ne PAS écrire `cfg(desktop)` ici. `desktop` est une convention
# Tauri, émise par tauri-build pendant la compilation ; Cargo résout les
# dépendances bien avant et ne connaît que les cfg réels. Avec `cfg(desktop)`
# la condition n'est jamais vraie et la dépendance disparaît de TOUTES les
# cibles, y compris Windows. Dans le code Rust, en revanche, `#[cfg(desktop)]`
# est valide, puisqu'il est évalué après tauri-build.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Windows Imaging Component : décodage HEIC/TIFF, miniatures, orientation EXIF.
# Déclarée par cible, sinon la compilation Android échoue à la résolution des
# dépendances — le crate `windows` n'a pas de sens hors Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

# Build release optimisé : binaire plus petit et plus rapide.
# panic = "abort" est compatible Tauri (pas de déroulement de pile attendu).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

