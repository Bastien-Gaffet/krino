<!doctype html>
<html lang="fr" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Krino — pré-tri</title>
  </head>
  <body class="mobile">
    <!-- ═══ Accueil / autorisation ═══ -->
    <section id="vue-onboard" class="vue vue-onboard">
      <div class="onboard-contenu">
        <img src="/logo.png" alt="" class="onboard-logo" width="96" height="96" />
        <h1>Krino</h1>
        <p class="onboard-accroche" data-i18n="mobile.accroche"></p>
        <ul class="onboard-points">
          <li data-i18n="mobile.point1"></li>
          <li data-i18n="mobile.point2"></li>
        </ul>
        <button id="btn-autoriser" class="btn btn-primaire btn-large" data-i18n="mobile.autoriser"></button>
        <p id="onboard-etat" class="onboard-etat"></p>
      </div>
    </section>

    <!-- ═══ Liste des mois ═══ -->
    <section id="vue-mois" class="vue" hidden>
      <header class="barre barre-mobile">
        <div class="bascule-media" role="tablist" aria-label="Photos ou vidéos">
          <button type="button" id="btn-mode-photos" class="bascule-option" role="tab" aria-selected="true" data-i18n="mobile.photos"></button>
          <button type="button" id="btn-mode-videos" class="bascule-option" role="tab" aria-selected="false" data-i18n="mobile.videos"></button>
        </div>
        <span class="espace"></span>
        <button id="btn-corbeille" class="btn btn-ico" data-i18n-title="corbeille.titre" aria-label="Corbeille">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        </button>
        <button id="btn-reglages" class="btn btn-ico" data-i18n-title="mois.reglages" aria-label="Réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>
      <div class="sous-barre-mois">
        <select id="tri-mois" class="btn">
          <option value="chrono" data-i18n="tri.date"></option>
          <option value="taille" data-i18n="tri.taille"></option>
          <option value="nombre" data-i18n="tri.nombre"></option>
          <option value="restants" data-i18n="tri.restants"></option>
        </select>
        <span id="btn-sens" class="sens" data-i18n-title="mois.inverser" role="button" tabindex="0"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M4 7l4-4 4 4"/></svg></span>
        <label class="filtre-faits"><input type="checkbox" id="masquer-faits" /> <span data-i18n="mois.masquerFaits"></span></label>
      </div>
      <div id="conteneur-mois" class="conteneur-mois"></div>
      <footer class="pied-demo">
        <span id="bandeau-demo"></span>
        <button id="btn-reinit-demo" class="btn btn-petit" data-i18n="mobile.reinitDemo"></button>
      </footer>
    </section>

    <!-- ═══ Tri (swipe) ═══
         Les deux cartes ont EXACTEMENT la même structure : sans ça, la photo
         change de taille et de position au moment où la carte de fond devient
         la carte active. -->
    <section id="vue-tri" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-mois" class="btn btn-ico" data-i18n-title="tri.retour" aria-label="Retour">&larr;</button>
        <span id="titre-tri" class="titre-dossier"></span>
        <span class="espace"></span>
        <span id="progression-tri" class="progression"></span>
      </header>
      <div id="scene" class="scene">
        <div id="carte-fond" class="carte carte-fond" hidden>
          <div class="carte-visuel">
            <img class="apercu-fond" alt="" aria-hidden="true" />
            <img class="apercu-photo" alt="" />
            <span class="marque-video-carte" data-i18n="vignette.video" hidden></span>
          </div>
          <div class="carte-infos"><span></span><span></span></div>
        </div>
        <div id="carte" class="carte" hidden>
          <div class="carte-visuel">
            <img id="apercu-fond" class="apercu-fond" alt="" aria-hidden="true" />
            <img id="apercu-img" class="apercu-photo" alt="" draggable="false" hidden />
            <video id="apercu-video" class="apercu-photo" playsinline muted loop controls hidden></video>
            <span class="marque-video-carte" data-i18n="vignette.video" hidden></span>
            <div id="badge-garder" class="badge badge-garder" data-i18n="rafale.garder"></div>
            <div id="badge-jeter" class="badge badge-jeter" data-i18n="rafale.jeter"></div>
          </div>
          <div id="carte-infos" class="carte-infos"><span></span><span></span></div>
        </div>
        <div id="fin-mois" class="fin-mois" hidden>
          <h2 data-i18n="finMois.titre"></h2>
          <p data-i18n="finMois.texte"></p>
          <button id="btn-fin-revue" class="btn btn-primaire btn-large" data-i18n="tri.revue"></button>
        </div>
      </div>
      <footer id="pied-tri" class="pied-tri pied-tri-mobile">
        <button id="btn-jeter" class="btn-rond btn-rond-jeter" data-i18n-title="tri.jeter" aria-label="Jeter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <button id="btn-annuler" class="btn-rond btn-rond-petit" data-i18n-title="tri.annulerTitre" aria-label="Annuler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h11a5 5 0 0 1 0 10h-3M3 10l5-5M3 10l5 5"/></svg>
        </button>
        <button id="btn-garder" class="btn-rond btn-rond-garder" data-i18n-title="tri.garder" aria-label="Garder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </footer>
    </section>

    <!-- ═══ Revue de fin de mois ═══ -->
    <section id="vue-revue" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-tri" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span id="titre-revue" class="titre-dossier"></span>
      </header>
      <p id="bilan-revue" class="sous-barre"></p>
      <div class="defilable">
        <p class="aide-revue" data-i18n="revue.aide"></p>
        <h3 class="titre-groupe garder" data-i18n="revue.gardees"></h3>
        <div id="grille-gardees" class="grille-vignettes"></div>
        <h3 class="titre-groupe jeter" data-i18n="revue.jetees"></h3>
        <div id="grille-jetees" class="grille-vignettes"></div>
      </div>
      <footer class="pied-action">
        <button id="btn-valider-mois" class="btn btn-primaire btn-large" data-i18n="revue.valider"></button>
      </footer>
    </section>

    <!-- ═══ Corbeille ═══ -->
    <section id="vue-corbeille" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-mois-2" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span class="titre-dossier" data-i18n="corbeille.titre"></span>
        <span class="espace"></span>
        <span id="bilan-corbeille" class="progression"></span>
      </header>
      <p class="aide-revue aide-corbeille"></p>
      <div id="grille-corbeille" class="grille-vignettes defilable"></div>
      <footer class="pied-action pied-action-double">
        <button id="btn-restaurer-tout" class="btn" data-i18n="corbeille.restaurerTout"></button>
        <button id="btn-vider" class="btn btn-danger" data-i18n="corbeille.vider"></button>
      </footer>
    </section>

    <!-- ═══ Réglages ═══ -->
    <section id="vue-reglages" class="vue" hidden>
      <header class="barre barre-mobile">
        <button id="btn-retour-mois-3" class="btn btn-ico" aria-label="Retour">&larr;</button>
        <span class="titre-dossier" data-i18n="mois.reglages"></span>
      </header>
      <div class="defilable reglages">
        <h3 class="titre-groupe" data-i18n="reglages.apparence"></h3>
        <div class="groupe-choix" id="choix-theme">
          <label><input type="radio" name="theme" value="auto" /><span data-i18n="mobile.themeAuto"></span></label>
          <label><input type="radio" name="theme" value="clair" /><span data-i18n="reglages.themeClair"></span></label>
          <label><input type="radio" name="theme" value="sombre" /><span data-i18n="reglages.themeSombre"></span></label>
        </div>

        <h3 class="titre-groupe" data-i18n="reglages.langue"></h3>
        <div class="groupe-choix" id="choix-langue">
          <label><input type="radio" name="langue" value="auto" /><span data-i18n="reglages.langueAuto"></span></label>
          <label><input type="radio" name="langue" value="fr" />Français</label>
          <label><input type="radio" name="langue" value="en" />English</label>
        </div>

        <h3 class="titre-groupe" data-i18n="reglages.affichage"></h3>
        <label class="ligne-reglage">
          <input type="checkbox" id="opt-annees" />
          <span data-i18n="reglages.grouperAnnees"></span>
        </label>

        <h3 class="titre-groupe" data-i18n="reglages.donnees"></h3>
        <button id="btn-reset-tout" class="btn btn-danger-leger" data-i18n="mois.reset" data-i18n-title="mois.resetTitre"></button>

        <h3 class="titre-groupe" data-i18n="mobile.aide"></h3>
        <button id="btn-revoir-tuto" class="btn" data-i18n="reglages.tuto"></button>

        <h3 class="titre-groupe" data-i18n="confidentialite.titre"></h3>
        <label class="ligne-reglage">
          <input type="checkbox" id="opt-telemetrie" />
          <span data-i18n="reglages.statsActivees"></span>
        </label>
        <p class="aide-revue" data-i18n="reglages.statsAide"></p>
        <p class="aide-revue anon-id">
          <span data-i18n="reglages.statsId"></span>
          <code id="anon-id"></code>
        </p>

        <h3 class="titre-groupe" data-i18n="mobile.soutien"></h3>
        <p class="aide-revue" data-i18n="mobile.soutienAide"></p>
        <a
          id="lien-kofi"
          class="btn btn-kofi"
          href="https://ko-fi.com/G2G71YFHWX"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img id="kofi-symbole" class="kofi-symbole" alt="" aria-hidden="true" />
          <span data-i18n="mobile.kofi"></span>
        </a>
        <a
          class="lien-site"
          href="https://krino.netlify.app"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="mobile.siteWeb"
        ></a>
      </div>
    </section>

    <!-- Dialogue maison, repris du desktop (src/dialogues.ts) : pas de popup
         natif du navigateur, thème et traductions respectés. -->
    <dialog id="dialogue-krino" class="dialogue-krino">
      <p class="dialogue-texte"></p>
      <input class="dialogue-champ" type="text" hidden />
      <div class="rangee-boutons">
        <button class="btn dialogue-annuler" data-i18n="dialogue.annuler"></button>
        <button class="btn btn-primaire dialogue-ok" data-i18n="dialogue.ok"></button>
      </div>
    </dialog>

    <!-- Superposition de chargement : le loader du desktop, repris tel quel
         (classes .chargement / .chargement-boite / .loader de styles.css). -->
    <div id="chargement" class="chargement" hidden>
      <div class="chargement-boite">
        <div class="loader"></div>
        <h2 id="chargement-titre"></h2>
      </div>
    </div>

    <!-- ═══ Bulle de tutoriel (classes .tuto-bulle/.tuto-cible de styles.css) ═══ -->
    <div id="tuto-bulle" class="tuto-bulle" hidden>
      <p id="tuto-texte"></p>
      <div class="rangee-boutons">
        <span id="tuto-etape" class="etape espace"></span>
        <button id="tuto-quitter" class="btn" data-i18n="tuto.quitter"></button>
        <button id="tuto-suivant" class="btn btn-primaire"></button>
      </div>
    </div>

    <script type="module" src="/src/mobile/main.ts"></script>
  </body>
</html>
